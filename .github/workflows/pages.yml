name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:demo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project consumers/python_plotly python consumers/python_plotly/render.py
      - name: Restore PR previews
        uses: actions/checkout@v4
        with:
          ref: preview-store
          path: preview-store
      - name: Assemble Pages site
        run: |
          mkdir -p pages-site
          cp -R site/. pages-site/
          if [ -d preview-store/pr-preview ]; then
            mkdir -p pages-site/pr-preview
            cp -R preview-store/pr-preview/. pages-site/pr-preview/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
