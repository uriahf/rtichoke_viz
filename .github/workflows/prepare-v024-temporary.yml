name: Verify committed v0.24.0 release

on:
  push:
    branches:
      - release/v0.24.0-observed-steps
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-dist.mjs
      - run: npm run schema
      - run: bash scripts/verify-committed-release.sh
