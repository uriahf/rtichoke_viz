name: Release browser bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run schema

      - name: Verify tag matches bundle version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${VERSION}"

      - name: Package immutable bundle
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          BUNDLE="rtichoke-viz-${VERSION}"
          mkdir -p "release/${BUNDLE}"
          cp dist/rtichoke-viz.js "release/${BUNDLE}/"
          cp dist/rtichoke-viz.css "release/${BUNDLE}/"
          cp schemas/rtichoke-viz.schema.json "release/${BUNDLE}/"
          printf 'version=%s\ncommit=%s\n' "${VERSION}" "${SOURCE_COMMIT}" \
            > "release/${BUNDLE}/MANIFEST"
          tar -C release -czf "release/${BUNDLE}.tar.gz" "${BUNDLE}"
          sha256sum "release/${BUNDLE}.tar.gz" \
            > "release/${BUNDLE}.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BUNDLE="rtichoke-viz-${VERSION}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "release/${BUNDLE}.tar.gz" \
              "release/${BUNDLE}.tar.gz.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "release/${BUNDLE}.tar.gz" \
              "release/${BUNDLE}.tar.gz.sha256" \
              --title "rtichoke_viz ${VERSION}" \
              --generate-notes
          fi
