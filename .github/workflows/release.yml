name: Release browser bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-dist.mjs
      - run: npm run schema

      - name: Verify tag matches bundle version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${VERSION}"

      - name: Package immutable bundle
        run: bash scripts/package-release.sh

      - name: Verify packaged bundle
        run: bash scripts/verify-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BUNDLE="rtichoke-viz-${VERSION}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "release/${BUNDLE}.tar.gz" \
              "release/${BUNDLE}.tar.gz.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "release/${BUNDLE}.tar.gz" \
              "release/${BUNDLE}.tar.gz.sha256" \
              --title "rtichoke_viz ${VERSION}" \
              --generate-notes
          fi
