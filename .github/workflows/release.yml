name: Release browser bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-dist.mjs
      - run: npm run schema

      - name: Verify release identity
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${VERSION}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"

      - name: Refuse to republish an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to replace versioned assets." >&2
            exit 1
          fi

      - name: Package immutable bundle
        run: bash scripts/package-release.sh

      - name: Verify packaged bundle
        run: bash scripts/verify-release.sh

      - name: Publish GitHub release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BUNDLE="rtichoke-viz-${VERSION}"
          gh release create "${RELEASE_TAG}" \
            "release/${BUNDLE}.tar.gz" \
            "release/${BUNDLE}.tar.gz.sha256" \
            --title "rtichoke_viz ${VERSION}" \
            --generate-notes
