name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-dist.mjs
      - run: npm run schema
      - name: Verify release artifact invariants
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          BUNDLE="rtichoke-viz-${VERSION}"

          SOURCE_COMMIT="${GITHUB_SHA}" bash scripts/package-release.sh release-a
          SOURCE_COMMIT="${GITHUB_SHA}" bash scripts/verify-release.sh release-a
          test -f "release-a/${BUNDLE}.tar.gz"
          test -f "release-a/${BUNDLE}.tar.gz.sha256"

          SOURCE_COMMIT="${GITHUB_SHA}" bash scripts/package-release.sh release-b
          SOURCE_COMMIT="${GITHUB_SHA}" bash scripts/verify-release.sh release-b

          cmp "release-a/${BUNDLE}.tar.gz" "release-b/${BUNDLE}.tar.gz"
          cmp "release-a/${BUNDLE}.tar.gz.sha256" "release-b/${BUNDLE}.tar.gz.sha256"

      - name: Verify release workflow cannot clobber published assets
        run: |
          ! grep -q -- '--clobber' .github/workflows/release.yml
          grep -q 'gh release view "${RELEASE_TAG}"' .github/workflows/release.yml
          grep -q 'refusing to replace versioned assets' .github/workflows/release.yml
          grep -q 'gh release create "${RELEASE_TAG}"' .github/workflows/release.yml

      - run: npm run build:demo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project consumers/python_plotly python -m unittest discover -s consumers/python_plotly -p 'test_*.py'
      - run: uv run --project consumers/python_plotly python consumers/python_plotly/render.py
      - name: Smoke-test generated assets
        run: |
          test -s dist/rtichoke-viz.js
          test -s dist/rtichoke-viz.css
          test -s schemas/rtichoke-viz.schema.json
          test -s schemas/rtichoke-viz-v2.schema.json
          test -s site/index.html
          test -s site/demo.js
          test -s site/python-plotly/roc.html
          test -s site/python-plotly/calibration.html
          test -s site/python-plotly/precision-recall.html
          test -s site/python-plotly/gains.html
          grep -q 'roc-chart' site/index.html
          grep -q 'calibration-chart' site/index.html
          grep -q 'precision-recall-chart' site/index.html
          grep -q 'gains-chart' site/index.html
          grep -q 'Python Plotly' site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: site

  r-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::ggplot2
            any::plotly
            any::htmlwidgets
            any::patchwork
      - run: Rscript consumers/R/render.R
      - name: Smoke-test R consumer outputs
        run: |
          test -s site/r-consumers/roc-ggplot.png
          test -s site/r-consumers/calibration-ggplot.png
          test -s site/r-consumers/precision-recall-ggplot.png
          test -s site/r-consumers/roc-plotly.html
          test -s site/r-consumers/calibration-plotly.html
          test -s site/r-consumers/precision-recall-plotly.html
          test -s site/r-consumers/gains-ggplot.png
          test -s site/r-consumers/gains-plotly.html
