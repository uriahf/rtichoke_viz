name: Consumer smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-plotly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install plotly
      - run: python consumers/python/smoke.py
        env:
          PYTHONPATH: consumers/python

  r-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::ggplot2
            any::plotly
      - run: Rscript consumers/R/smoke.R
