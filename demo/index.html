<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rtichoke_viz demo</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    main { display: grid; gap: 2rem; }
    section { border: 1px solid #bbb6; border-radius: 12px; padding: 1rem; }
    .chart { overflow-x: auto; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>rtichoke_viz proof of concept</h1>
      <p>These charts are rendered from the canonical deterministic JSON fixtures used by the test suite.</p>
    </header>
    <section>
      <h2>ROC</h2>
      <div id="roc-chart" class="chart"></div>
    </section>
    <section>
      <h2>Calibration</h2>
      <div id="calibration-chart" class="chart"></div>
    </section>
  </main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
